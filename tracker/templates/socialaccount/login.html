{% extends "base.html" %}
{% load i18n %}
{% load socialaccount %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #ffffff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(124, 58, 237, 0.1); max-width: 400px; width: 100%; text-align: center; border: 1px solid #f3e8ff;">
        
        <!-- Dynamic Provider Icon -->
        {% if provider.id == 'google' %}
            <div style="font-size: 3rem; margin-bottom: 10px;">🌐</div>
        {% else %}
            <div style="font-size: 3rem; margin-bottom: 10px;">
                <svg height="48" viewBox="0 0 16 16" version="1.1" width="48" aria-hidden="true" style="fill: #24292e;">
                    <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
                </svg>
            </div>
        {% endif %}
        
        <h2 style="color: #1f2937; font-size: 1.6rem; margin-bottom: 8px; font-weight: 700;">Sign In Via {{ provider.name }}</h2>
        <p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 24px;">You are about to sign in using your {{ provider.name }} account.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" style="width: 100%; padding: 12px; background: {% if provider.id == 'google' %}#4285F4{% else %}#24292e{% endif %}; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 0.95rem; cursor: pointer; box-sizing: border-box;">
                Continue to {{ provider.name }}
            </button>
        </form>
    </div>
</div>
{% endblock %}
