<!DOCTYPE html>
<html lang="en">
<head>
    {% load pwa %}
    {% progressive_web_app_meta %} 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangarin</title>

<style>
  .mobile-header {
    display: none;
  }

  @media (max-width: 768px) {
    .mobile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 1001;
    }

    .mobile-header button {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .mobile-logo {
      font-weight: bold;
      font-size: 18px;
      color: #5b21b6;
    }

    .sidebar, 
    aside, 
    [class*="sidebar"] {
      position: fixed;
      left: -100%; 
      top: 0;
      bottom: 0;
      width: 250px;
      z-index: 1000;
      transition: left 0.3s ease-in-out;
      background-color: #f3e8ff;
      box-shadow: 2px 0 10px rgba(0,0,0,0.15);
    }

    .sidebar.active, 
    aside.active, 
    [class*="sidebar"].active {
      left: 0 !important;
    }

    .main-content, 
    main, 
    .content {
      width: 100% !important;
      margin-left: 0 !important;
      padding: 12px !important;
    }
  }
</style>
    </head>

    <body style="background-color: #fcf4f9; margin: 0; font-family: system-ui, -apple-system, sans-serif;">
        {% block content %}
        {% endblock %}
    
    <div class="mobile-header">
    <button id="sidebar-toggle" onclick="toggleSidebar()">☰ Menu</button>
    <span class="mobile-logo">Hangarin</span>
    </div>
    
    {% if user.is_authenticated %}
    <div class="mobile-bottom-nav">
    <a href="/dashboard/" class="nav-item">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
    </a>
    <a href="/" class="nav-item">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Checklist</span>
    </a>
    <a href="{% url 'account_logout' %}" class="nav-item">

        <span class="nav-icon">🚪</span>
        <span class="nav-label">Logout</span>
    </a>
    </div>
    {% endif %}

<script>
    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar') || document.querySelector('aside') || document.querySelector('[class*="sidebar"]');
        if (sidebar) {
        sidebar.classList.toggle('active');
        }
    }
</script>
</body>
</html>
