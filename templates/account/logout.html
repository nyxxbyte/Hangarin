<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Out - Hangarin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fbcfe8 0%, #f3e8ff 50%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 36px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(233, 213, 255, 0.8);
            text-align: center;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 800;
            color: #4a154b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-title {
            font-size: 22px;
            font-weight: 800;
            color: #2e1065;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: #6b21a8;
            opacity: 0.8;
            margin-bottom: 24px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #dc2626;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background: #b91c1c;
        }

        .btn-cancel {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: #f3f4f6;
            color: #4b5563;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 10px;
            transition: background 0.2s ease;
        }

        .btn-cancel:hover {
            background: #e5e7eb;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand-logo">☁️ Hangarin</div>
    <h1 class="auth-title">Sign Out</h1>
    <p class="auth-subtitle">Are you sure you want to sign out of your workspace?</p>

    <form method="POST" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn-submit">Sign Out</button>
        <a href="/" class="btn-cancel">Cancel</a>
    </form>
</div>

</body>
</html>
